services:
  db:
    image: pgvector/pgvector:pg16
    container_name: omhas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omhas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-omhas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omhas}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
