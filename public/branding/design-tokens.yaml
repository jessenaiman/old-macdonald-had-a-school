version: 1
runtime_authority: app/globals.css
asset_registry: app/brand-assets.css
documents:
  palette_and_type: public/branding/PALETTE_AND_TYPOGRAPHY.md
  design_system: public/branding/DESIGN_SYSTEM.md
  asset_recipes: public/BRAND_ASSET_RECIPES.md
  cast_data: public/CAST_AND_ROLES.md
palette:
  navy: { css: --navy, light: "#0B1A33", role: primary-ink-and-navigation }
  blue: { css: --blue, light: "#3F78A4", role: supporting-school-surface }
  sky: { css: --sky, light: "#B9D3E6", role: low-emphasis-accent }
  gold: { css: --gold, light: "#E1B84B", role: sparing-highlight }
  red: { css: --red, light: "#C33F3F", role: energetic-accent }
  coral: { css: --coral, light: "#D45D6D", role: warm-supporting-accent }
  pink: { css: --pink, light: "#D98291", role: supporting-accent }
  plum: { css: --plum, light: "#8D7AA8", role: supporting-accent }
  orange: { css: --orange, light: "#D97A2B", role: label-and-warm-emphasis }
  paper: { css: --card, light: "#FDF8EC", role: readable-card-surface }
  ink: { css: --brand-ink, light: "#173552", role: readable-ink }
  copy: { css: --brand-copy, light: "#574D40", role: secondary-copy }
typography:
  display: { class: font-heading, role: headings-and-destinations }
  handwritten: { class: font-hand, role: short-teacher-voice-and-emphasis }
  body: { class: font-body, role: paragraphs-labels-and-controls }
identity:
  rule: Character colours are local cast contexts, never grade-wide themes.
  source: public/CAST_AND_ROLES.md
theme_comparisons:
  current: { label: Current site palette, status: baseline }
  patchwork-day: { label: Patchwork - Farm Day, designer: A, page: "#7FA7B8", board: "#256C6B", note: "#F5E5BD", card: "#D9C18E" }
  patchwork-dusk: { label: Patchwork - Lullaby Dusk, designer: A, page: "#0D2038", board: "#173F46", note: "#293D69", card: "#413224" }
  schoolhouse-day: { label: Schoolhouse Dusk - Early Evening, designer: B, page: "#DCE7EA", board: "#214B68", note: "#F8EFDA", card: "#F5F9F7" }
  schoolhouse-dusk: { label: Schoolhouse Dusk - Storybook Night, designer: B, page: "#0D1C2C", board: "#173D56", note: "#253F52", card: "#1B3043" }
  cast_rule: Canonical cast colours do not change when a comparison theme changes.
controls:
  action: Button
  panels: Tabs
  menu: NavigationMenu-or-DropdownMenu-or-Sheet
  asset_preview: Dialog
  optional_detail: Collapsible
